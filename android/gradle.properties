org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX is the only viable choice; old support library is dead.
android.useAndroidX=true

# R8 full mode is the default in AGP 8+. Off here because we don't need
# obfuscation for a personal sideloaded app.
android.enableR8.fullMode=false

# Kotlin code style for any newly created files via Studio actions.
kotlin.code.style=official

# Compose-related gradle props
android.nonTransitiveRClass=true
android.nonFinalResIds=true
