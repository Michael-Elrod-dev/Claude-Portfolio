# Caddy's container bind-mounts /run/caddy-upstreams read-only. A bind mount holds on to the
# directory it was given, so these must never be a RuntimeDirectory that systemd deletes and
# makes again on every restart. Mimir's and Pantry's tmpfiles files make the parent too.
d /run/caddy-upstreams                   0755 root             root             -
d /run/caddy-upstreams/claude-portfolio  0755 claude-portfolio claude-portfolio -
